<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Prabha Shankar Learning Ventures</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="logo.png" alt="Logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Registration Form -->
    <section class="registration-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="registration-card">
                        <h1 class="text-center mb-4">Start Your Learning Journey</h1>

                        <form id="registrationForm">
                            <!-- Personal Information -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullName" name="fullName" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-success">Register</button>
                            </div>
                        </form>

                        <p class="text-center mt-3" id="message"></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>Contact us: <a href="mailto:example@example.com">example@example.com</a></p>
        <p>Follow us on <a href="https://instagram.com/" target="_blank">Instagram</a></p>
        <a href="https://api.whatsapp.com/send?phone=911234567890" target="_blank">WhatsApp Us</a>
    </footer>

    <!-- JavaScript to Connect Frontend to Backend -->
    <script>
        document.getElementById("registrationForm").addEventListener("submit", async function (event) {
            event.preventDefault(); // Prevent page refresh

            // Get form values
            const name = document.getElementById("fullName").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("http://localhost:5050/api/users", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();
                const messageElement = document.getElementById("message");

                if (response.ok) {
                    messageElement.innerHTML = "✅ Registration Successful!";
                    messageElement.style.color = "green";
                    
                    // Redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 2000);
                } else {
                    messageElement.innerHTML = "❌ Error: " + data.error;
                    messageElement.style.color = "red";
                }
            } catch (error) {
                console.error("Error:", error);
                document.getElementById("message").innerHTML = "❌ Server error. Try again later.";
                document.getElementById("message").style.color = "red";
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
